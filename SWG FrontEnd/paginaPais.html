<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <title>Pais</title>
</head>
<body class="bg-dark">
    <form class="container bg-light p-4">
    <label for="" class="form-label mb-3"><h2>Cadastro de País</h2></label>
    <div class="row g-3 bg-secondary bg-opacity-10">
        <div class="col-md-3">
            <label class="form-label">Nome do Pais</label>
            <input type="text" class="form-control" required>
            <div class="invalid-feedback">Campo obrigatório</div>
        </div>
        <div class="col-md-2">
            <label class="row justify-content-center form-label">Sigla ISO-2</label>
            <input type="tel" class="form-control" placeholder="AA" required maxlength="2">
            <div class="invalid-feedback">Campo obrigatório</div>
        </div>
        <div class="col-md-2">
            <label class="row justify-content-center form-label">Sigla ISO-3</label>
            <input type="tel" class="form-control" placeholder="AAA" required maxlength="3">
            <div class="invalid-feedback">Campo obrigatório</div>
        </div>
        <div class="col-md-2">
            <label class="row justify-content-center form-label">DDI</label>
            <div class="input-group">
                <span class="input-group-text">+</span>
                    <input type="number" class="form-control" min="1" placeholder="99">
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <label for="" class="form-label">&nbsp;</label>
        <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-dark" type="submit">Salvar</button>
                <button class="btn btn-dark" type="submit">Cancelar</button>
            </div>
        </div>  
        </div>
    </div>
    </form>
<br>
<div class="container bg-light p-4">
    <label for="" class="form-label"><h2>País</h2></label>
    <hr>
    <div class="table-responsive">
        <table class="table table-bordered table-hover table-striped caption-top">
            <caption>
                Lista de Países
            </caption>
            <thead class="table-dark">
                <tr class="text-center">
                    <th>Nome</th>
                    <th>Sigla Iso 2</th>
                    <th>Sigla Iso 3</th>
                    <th>DDI</th>
                </tr>
            </thead>
            <tbody class="text-center">
                <tr>
                    <td>Brasil</td>
                    <td>Br</td>
                    <td>Bra</td>
                    <td>55</td>
                </tr>
                <tr>
                    <td>Ingraterra</td>
                    <td>Gb</td>
                    <td>Gbr</td>
                    <td>44</td>
                </tr>
                <tr>
                    <td>Estados Unidos da America</td>
                    <td>Eu</td>
                    <td>Eua</td>
                    <td>1</td>
                </tr>
            </tbody>
        </table>
    </div>
        <div class="">
            <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-dark" type="submit">Inserir</button>
                <button class="btn btn-dark" type="submit" disabled>Deletar</button>
                <button class="btn btn-dark" type="button" disabled>Alterar</button>
            </div>
        </div>    
</div>


</body>
</html>
