<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <title>Hóspede</title>
</head>
<body class="bg-dark">
    <form action="" class="container bg-light p-4">
        <label for="" class="form-label mb-4"><h2>Cadastro de Reservas</h2></label>
        <div class="row g-3 bg-secondary bg-opacity-10">
            <div class="col-md-12 justift-content-center">
                <label for="hospede" class="form-label">Hóspede</label>
                <select name="hospede" id="hospede" class="form-select">
                    <option value="selecione">Selecione</option>
                </select>
            </div>
            <div class="col-md-6">
                <div class="container bg-white p-2">
                    <div class="d-flex align-items-center mb-3">
                        <label for="periodo-entrada" class="form-label me-2 mb-0">Entrada</label>
                        <input type="date" name="periodo-entrada" id="periodo-entrada" class="form-control">
                    </div>
                    <div class="d-flex align-items-center mb-3">
                        <label for="periodo-saida" class="form-label me-4 mb-0">Saída</label>
                        <input type="date" name="periodo-saida" id="periodo-saida" class="form-control">
                    </div>  
                    <div class="d-flex align-items-center mb-2">
                        <label for="tipo-quarto" class="form-label col-md-5 mb-1">Tipo de Quarto</label>
                        <select name="tipo-quarto" id="tipo-quarto" class="form-select">
                            <option value="">Selecionar</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="container bg-white p-2">
                    <div class="d-flex align-items-center mb-3">
                        <label for="num-pessoas" class="form-label col-md-4 me-2 mb-0">Nº de Pessoas</label>
                        <input type="number" name="num-pessoas" id="num-pessoas" class="form-control" min="1">
                    </div>
                    <div class="d-flex mb-3">
                        <label for="observacao" class="form-label col-md-4 me-2 mb-0">Observação</label>
                        <textarea name="observacao" id="observacao" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        <div class="mb-2">
            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-dark" type="submit">Salvar</button>
                <button class="btn btn-dark" type="submit" disabled>Cancelar</button>
                <button class="btn btn-dark" type="button" disabled>Limpar</button>
            </div>  
        </div>
        </div>
    </form>
    <br>
    <div class="container bg-light p-4">
        <label for="" class="form-label"><h2>Reserva</h2></label>
        <hr>
        <div class="table-responsive">
            <table class="table table-bordered table-hover table-striped caption-top">
                <caption>
                    Lista de Reservas
                </caption>
                <thead class="table-dark">
                    <tr class="text-center">
                        <th>Hóspede</th>
                        <th>Entrada</th>
                        <th>Saida</th>
                        <th>Tipo de Quarto</th>
                        <th>Nº de Pessoas</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr>
                        <td>Ronaldo</td>
                        <td>01/03/2026</td>
                        <td>10/03/2026</td>
                        <td>Suíte Master</td>
                        <td>2</td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Anastasia</td>
                        <td>08/03/2026</td>
                        <td>16/03/2026</td>
                        <td>Individual</td>
                        <td>1</td>
                        <td>Muito Foda</td>
                    </tr>
                    <tr>
                        <td>Rodolfo</td>
                        <td>20/03/2026</td>
                        <td>01/04/2026</td>
                        <td>Individual</td>
                        <td>1</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="">
            <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-dark" type="submit">Inserir</button>
                <button class="btn btn-dark" type="submit" disabled>Deletar</button>
                <button class="btn btn-dark" type="button" disabled>Alterar</button>
            </div>
        </div>    
</div>
</body>
</html>
