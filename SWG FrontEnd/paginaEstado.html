<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <title>Estados</title>
</head>
<body class="bg-dark">
    <br>
    <form action="" class="container bg-light p-4">
        <h2>Cadastro de Estado</h2>
        <br>
        <div class="row g-3 bg-secondary bg-opacity-10">
            <div class="col-md-6">
                <label for="nome-estado" class="form-label">Nome do Estado</label>
                <input type="text" name="nome-estado" id="nome-estado" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="regiao-geografica" class="form-label">Região Geográfica</label>
                <input type="text" name="regiao-geografica" id="regiao-geografica" class="form-control">
            </div>
                <div class="col-md-4">
                <label for="sigla-uf" class="form-label">Sigla UF</label>
                <input type="text" class="form-control"  placeholder="AAA" required maxlength="3">
            </div>
            <div class="col-md-8">
                <label for="number" class="form-label">Pais</label>
                <select name="tipo-quarto" id="tipo-quarto" class="form-select">
                    <option value="">Selecione</option>
                </select>
            </div>
            <div class="col mb-3">
                <div class="d-flex justify-content-end gap-1">
                    <button class="btn btn-dark" type="submit">Salvar</button>
                    <button class="btn btn-dark" type="submit">Cancelar</button>
                    <button class="btn btn-dark" type="button">Limpar</button>
                </div>
            </div>    
        </div>
    </form>
    <br>
    <div class="container bg-light p-4">
    <label for="" class="form-label"><h2>Estados</h2></label>
    <hr>
    <div class="table-responsive">
        <table class="table table-bordered table-hover table-striped caption-top">
            <caption>
                Lista de Estados
            </caption>
            <thead class="table-dark">
                <tr class="text-center">
                    <th>Nome do Estado</th>
                    <th>Região Geográfica</th>
                    <th>Sigla UF</th>
                    <th>Pais</th>
                </tr>
            </thead>
            <tbody class="text-center">
                <tr>
                    <td>Espirito Santo</td>
                    <td>Sudeste</td>
                    <td>ES</td>
                    <td>Brasil</td>
                </tr>
                <tr>
                    <td>São Paulo</td>
                    <td>Sudeste</td>
                    <td>SP</td>
                    <td>Brasil</td>
                </tr>
                <tr>
                    <td>Normandia</td>
                    <td>Noroeste</td>
                    <td>NOR</td>
                    <td>França</td>
                </tr>
            </tbody>
        </table>
    </div>
        <div class="">
            <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-dark" type="submit">Inserir</button>
                <button class="btn btn-dark" type="submit" disabled>Deletar</button>
                <button class="btn btn-dark" type="button" disabled>Alterar</button>
            </div>
        </div>    
    </div>
</body>
</html>
