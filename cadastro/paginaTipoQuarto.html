<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tipo Quarto</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-dark-subtle">
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container p-2">
            <a href="#" class="navbar-brand">Sistema de Gestão de Hotelaria</a>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link disabled">Cadastros</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Processo de Négocio</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Relatórios</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Contato</a>
                    </li>
                </ul>
            </div>
      </div>
    </nav>
    <form class="container bg-light p-4">
        <label for="" class="form-label mb-3"><h2>Cadastro de Tipo Quarto</h2></label>
        <div class="row g-3 bg-secondary bg-opacity-10">
            <div class="col-md-8">
                <label for="descricao" class="form-label">Descrição</label>
                <br>
                <textarea name="descricao" id="descricao" cols="25" rows="5" class="form-control"></textarea>
            </div>
            <div class="col-md-4 d-flex">
                <div>
                    <label for="preco" class="form-label">Preço</label>
                    <div class="input-group mb-4">
                        <span class="input-group-text">R$</span>
                        <div class="col-md-8">
                            <input type="text" name="preco" id="preco" class="form-control" placeholder="0,00">
                        </div>
                        <span class="input-group-text">/dia</span>
                    </div>
                    <label for="" class="form-label">Capacidade Máxima</label>
                    <div class="input-group">
                        <div class="col-md-8">
                            <input type="number" name="capacidade-max" id="capacidade-max" class="form-control" min="1">
                        </div>
                         <span class="input-group-text">/Pessoa</span>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <label class="form-label">Tipo de Cama</label>
                <select name="tipo-cama" id="tipo-cama" class="form-select">
                    <option value="" >Selecione</option>
                </select>
            </div>
                <div class="col-md-4">
                <label class="form-label">Tamanho</label>
                <div class="input-group">
                    <input type="text" name="tipo-cama" id="tipo-cama" class="form-control">
                    <span class="input-group-text">m^2</span>
                </div>
            </div>
            <div class="col mb-3">
            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-dark" type="submit">Salvar</button>
                <button class="btn btn-dark" type="submit">Cancelar</button>
            </div>
        </div>
        </div>
        
    </form>
    <div class="bg-dark text-secondary p-3 mt-auto" data-bs-theme="dark">
      <hr>
      <footer class="d-flex justify-content-between">
          <span class="d-flex gap-3">
              <span>© 2026 SWG.com.</span>
              <span>Todos os direitos reservados.</span>
          </span>
          <span class="d-flex gap-3">
              <a href="#" class="nav-link">Privacidade</a>
              <a href="#" class="nav-link">Termos de Uso</a>
          </span>
      </footer>
  </div>

</body>
</html>
